# Configure Spring Boot to run on port 8081 to prevent port conflicts
server.port=8081

# Enable H2 database console access at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Keep database schema updates automatic
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
